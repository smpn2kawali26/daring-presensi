<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SMPN 2 KAWALI - Presensi Daring</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
        }
        .logo-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 8px;
            border-radius: 12px;
        }
        .school-info h1 { font-size: 20px; color: #1e3c72; }
        .school-info p { font-size: 12px; color: #666; }
        .datetime {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 12px;
            margin-top: 12px;
        }
        .date { font-size: 14px; color: #555; }
        .time { font-size: 28px; font-weight: bold; color: #1e3c72; }
        
        /* Card */
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1e3c72;
        }
        
        /* Form */
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
        }
        input:focus, select:focus { border-color: #1e3c72; outline: none; }
        
        /* Camera */
        .camera-box {
            background: #f5f5f5;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .video-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        video, canvas {
            width: 100%;
            max-height: 280px;
            display: block;
        }
        canvas { display: none; }
        .preview-img { width: 100%; max-width: 180px; border-radius: 12px; margin-top: 10px; }
        
        /* Buttons */
        .btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        button {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
        }
        .btn-success { background: #2e7d32; }
        .btn-danger { background: #c62828; }
        .btn-camera { background: #ff9800; }
        .submit-btn {
            width: 100%;
            background: #2e7d32;
            padding: 14px;
            font-size: 16px;
            margin-top: 8px;
        }
        
        /* Status */
        .gps-status {
            padding: 12px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: 13px;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .gps-error { background: #ffebee; color: #c62828; }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number { font-size: 20px; font-weight: bold; }
        .stat-label { font-size: 10px; }
        
        /* Kelas Stats */
        .kelas-list {
            max-height: 350px;
            overflow-y: auto;
        }
        .kelas-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .kelas-name { font-weight: 700; width: 45px; }
        .kelas-counts { display: flex; gap: 12px; font-size: 12px; flex-wrap: wrap; }
        .kelas-counts span { display: inline-flex; align-items: center; gap: 3px; }
        
        .file-info { font-size: 11px; color: #888; margin-top: 5px; }
        .file-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .file-preview-item { width: 60px; height: 60px; border-radius: 8px; overflow: hidden; position: relative; }
        .file-preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .remove-file {
            position: absolute;
            top: -6px;
            right: -6px;
            background: red;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            text-align: center;
            line-height: 18px;
        }
        hr { margin: 16px 0; border: none; border-top: 1px solid #eee; }
        .required { color: red; margin-left: 3px; }
        .warning { color: red; font-size: 12px; margin-top: 5px; display: none; }
        .camera-select-group { margin-bottom: 12px; text-align: left; }
        .camera-select-group select { width: 100%; padding: 8px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img class="logo-img" id="logoImg" alt="Logo" src="logo.png" onerror="this.src='https://via.placeholder.com/70?text=SMPN2'">
            <div class="school-info">
                <h1>SMPN 2 KAWALI</h1>
                <p>Sistem Presensi Daring & Upload Tugas</p>
            </div>
            <div class="datetime">
                <div class="date" id="date"></div>
                <div class="time" id="time"></div>
            </div>
        </div>

        <!-- Form -->
        <div class="card">
            <div class="card-title"><i class="fas fa-edit"></i> Form Presensi</div>
            
            <div class="form-group">
                <label>Nama Lengkap <span class="required">*</span></label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap">
            </div>

            <div class="form-group">
                <label>Kelas <span class="required">*</span></label>
                <select id="kelas">
                    <option value="">Pilih Kelas</option>
                    <option value="7a">7A</option><option value="7b">7B</option><option value="7c">7C</option>
                    <option value="8a">8A</option><option value="8b">8B</option><option value="8c">8C</option>
                </select>
            </div>

            <div class="form-group">
                <label>Aktivitas <span class="required">*</span></label>
                <select id="aktivitas">
                    <option value="">Pilih Aktivitas</option>
                    <option value="Absen Masuk">✅ Absen Masuk</option>
                    <option value="Absen Pulang">🏠 Absen Pulang</option>
                    <option value="Izin">📝 Izin</option>
                    <option value="Sakit">🤒 Sakit</option>
                    <option value="Upload Tugas">📤 Upload Tugas</option>
                </select>
            </div>

            <!-- Pilihan Kamera Depan/Belakang -->
            <div id="cameraSelectGroup" class="camera-select-group" style="display:none;">
                <label><i class="fas fa-camera-retro"></i> Pilih Kamera</label>
                <select id="cameraSelect">
                    <option value="user">📱 Kamera Depan</option>
                    <option value="environment">📷 Kamera Belakang</option>
                </select>
            </div>

            <!-- Camera Section -->
            <div class="camera-box" id="cameraBox">
                <label>📸 Scan Wajah <span class="required">*</span></label>
                <div class="video-wrapper">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas"></canvas>
                </div>
                <div class="btn-group">
                    <button type="button" id="captureBtn" class="btn-success">📷 Ambil Gambar</button>
                    <button type="button" id="retakeBtn" style="display:none;" class="btn-danger">🔄 Ambil Ulang</button>
                </div>
                <div id="preview"></div>
                <div id="cameraWarning" class="warning">⚠️ Foto wajah wajib diambil!</div>
            </div>

            <!-- Upload Tugas -->
            <div class="form-group" id="uploadBox" style="display:none;">
                <label>📎 Upload Tugas (Max 5 foto) <span class="required">*</span></label>
                <input type="file" id="fileTugas" accept="image/*" multiple>
                <div class="file-info">Max 5 file, masing-masing max 2MB</div>
                <div id="filePreview" class="file-preview"></div>
                <div id="fileWarning" class="warning">⚠️ Minimal upload 1 file!</div>
            </div>

            <!-- GPS -->
            <div id="gpsStatus" class="gps-status">📍 Mengambil lokasi...</div>

            <button id="submitBtn" class="submit-btn">📤 KIRIM SEKARANG</button>
        </div>

        <!-- Statistik -->
        <div class="card">
            <div class="card-title">📊 Total Absensi Hari Ini</div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number" id="totalMasuk">0</div><div class="stat-label">Masuk</div></div>
                <div class="stat-card"><div class="stat-number" id="totalPulang">0</div><div class="stat-label">Pulang</div></div>
                <div class="stat-card"><div class="stat-number" id="totalIzin">0</div><div class="stat-label">Izin</div></div>
                <div class="stat-card"><div class="stat-number" id="totalSakit">0</div><div class="stat-label">Sakit</div></div>
                <div class="stat-card"><div class="stat-number" id="totalTugas">0</div><div class="stat-label">Tugas</div></div>
            </div>
            <hr>
            <div class="card-title">📊 Statistik Per Kelas</div>
            <div id="kelasStats" class="kelas-list"></div>
        </div>
    </div>

    <script>
        // ==================== KONFIGURASI ====================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxcw0J59ojWkJxQJKRgn8UmNLHee1qwyAmMCR3oU2DmveaqjHDXP8_lryRlJV0cJrljBQ/exec';
        
        let currentStream = null;
        let capturedPhoto = null;
        let currentLocation = null;
        let selectedFiles = [];
        let currentFacing = 'user';

        // ==================== TAMPILAN WAKTU ====================
        function updateDateTime() {
            const now = new Date();
            const hari = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const waktu = now.toLocaleTimeString('id-ID');
            document.getElementById('date').innerHTML = hari;
            document.getElementById('time').innerHTML = waktu;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ==================== LOGO ====================
        const logo = document.getElementById('logoImg');
        logo.src = 'logo.png';
        logo.onerror = function() { 
            console.log('Logo tidak ditemukan, menggunakan placeholder');
            this.src = 'https://via.placeholder.com/70?text=SMPN2';
        };

        // ==================== KAMERA ====================
        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(t => t.stop());
                }
                
                const constraints = {
                    video: { facingMode: { exact: currentFacing } }
                };
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                const video = document.getElementById('video');
                video.srcObject = currentStream;
                video.setAttribute('playsinline', true);
                document.getElementById('cameraWarning').style.display = 'none';
            } catch(e) {
                // Fallback ke kamera default
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    document.getElementById('video').srcObject = currentStream;
                } catch(err) {
                    document.querySelector('.video-wrapper').innerHTML = '<div style="padding:20px;color:red;">⚠️ Izin kamera ditolak</div>';
                }
            }
        }

        // Ganti kamera
        document.getElementById('cameraSelect').addEventListener('change', function() {
            currentFacing = this.value;
            startCamera();
        });

        document.getElementById('captureBtn').onclick = function() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            
            if (!video.videoWidth || video.videoWidth === 0) {
                alert('Kamera belum siap. Tunggu sebentar.');
                return;
            }
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedPhoto = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('preview').innerHTML = `<img src="${capturedPhoto}" class="preview-img">`;
            video.style.display = 'none';
            canvas.style.display = 'block';
            this.style.display = 'none';
            document.getElementById('retakeBtn').style.display = 'inline-block';
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            document.getElementById('cameraWarning').style.display = 'none';
        };

        document.getElementById('retakeBtn').onclick = function() {
            capturedPhoto = null;
            document.getElementById('video').style.display = 'block';
            document.getElementById('canvas').style.display = 'none';
            document.getElementById('captureBtn').style.display = 'inline-block';
            this.style.display = 'none';
            document.getElementById('preview').innerHTML = '';
            startCamera();
        };

        // ==================== UPLOAD FILE ====================
        document.getElementById('fileTugas').onchange = function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 5) {
                alert('Maksimal 5 file!');
                this.value = '';
                return;
            }
            selectedFiles = [];
            const preview = document.getElementById('filePreview');
            preview.innerHTML = '';
            for (let i = 0; i < files.length; i++) {
                if (files[i].size > 2 * 1024 * 1024) {
                    alert(`File ${files[i].name} terlalu besar! Max 2MB`);
                    continue;
                }
                selectedFiles.push(files[i]);
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = 'file-preview-item';
                    div.innerHTML = `<img src="${e.target.result}"><div class="remove-file" onclick="removeFile(${i})">×</div>`;
                    preview.appendChild(div);
                };
                reader.readAsDataURL(files[i]);
            }
            document.getElementById('fileWarning').style.display = 'none';
        };

        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            const dt = new DataTransfer();
            selectedFiles.forEach(f => dt.items.add(f));
            document.getElementById('fileTugas').files = dt.files;
            document.getElementById('fileTugas').dispatchEvent(new Event('change'));
        };

        // ==================== GPS ====================
        function getLocation() {
            if (!navigator.geolocation) {
                document.getElementById('gpsStatus').innerHTML = '⚠️ GPS tidak didukung';
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    document.getElementById('gpsStatus').innerHTML = `📍 Lokasi: ${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}`;
                    document.getElementById('gpsStatus').className = 'gps-status';
                },
                () => {
                    document.getElementById('gpsStatus').innerHTML = '⚠️ Izin lokasi ditolak';
                    document.getElementById('gpsStatus').className = 'gps-status gps-error';
                }
            );
        }
        getLocation();

        // ==================== TOGGLE FORM ====================
        document.getElementById('aktivitas').onchange = function() {
            const val = this.value;
            const cameraBox = document.getElementById('cameraBox');
            const uploadBox = document.getElementById('uploadBox');
            const cameraSelectGroup = document.getElementById('cameraSelectGroup');
            
            if (val === 'Upload Tugas') {
                cameraBox.style.display = 'none';
                cameraSelectGroup.style.display = 'none';
                uploadBox.style.display = 'block';
                if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            } else if (val === 'Absen Masuk' || val === 'Absen Pulang' || val === 'Izin' || val === 'Sakit') {
                cameraBox.style.display = 'block';
                cameraSelectGroup.style.display = 'block';
                uploadBox.style.display = 'none';
                startCamera();
            } else {
                cameraBox.style.display = 'block';
                cameraSelectGroup.style.display = 'none';
                uploadBox.style.display = 'none';
            }
        };

        // ==================== STATISTIK (LocalStorage) ====================
        function loadStats() {
            const today = new Date().toLocaleDateString('id-ID');
            let stats = localStorage.getItem('presensi_' + today);
            
            if (!stats) {
                // Inisialisasi data awal jika belum ada
                stats = {
                    total: { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                    kelas: {
                        '7a': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '7b': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '7c': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '8a': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '8b': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '8c': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 }
                    }
                };
                localStorage.setItem('presensi_' + today, JSON.stringify(stats));
            } else {
                stats = JSON.parse(stats);
            }
            
            // Update total
            document.getElementById('totalMasuk').innerText = stats.total.masuk;
            document.getElementById('totalPulang').innerText = stats.total.pulang;
            document.getElementById('totalIzin').innerText = stats.total.izin;
            document.getElementById('totalSakit').innerText = stats.total.sakit;
            document.getElementById('totalTugas').innerText = stats.total.tugas;
            
            // Update per kelas
            const container = document.getElementById('kelasStats');
            container.innerHTML = '';
            const kelasList = ['7a', '7b', '7c', '8a', '8b', '8c'];
            for (const k of kelasList) {
                const d = stats.kelas[k];
                const div = document.createElement('div');
                div.className = 'kelas-item';
                div.innerHTML = `
                    <span class="kelas-name">${k.toUpperCase()}</span>
                    <div class="kelas-counts">
                        <span>📥 ${d.masuk}</span>
                        <span>🏠 ${d.pulang}</span>
                        <span>📝 ${d.izin}</span>
                        <span>🤒 ${d.sakit}</span>
                        <span>📄 ${d.tugas}</span>
                    </div>
                `;
                container.appendChild(div);
            }
        }
        
        function updateStats(kelas, aktivitas) {
            const today = new Date().toLocaleDateString('id-ID');
            let stats = JSON.parse(localStorage.getItem('presensi_' + today));
            
            if (!stats) {
                stats = {
                    total: { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                    kelas: {
                        '7a': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '7b': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '7c': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '8a': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '8b': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 },
                        '8c': { masuk: 0, pulang: 0, izin: 0, sakit: 0, tugas: 0 }
                    }
                };
            }
            
            let key = '';
            if (aktivitas === 'Absen Masuk') key = 'masuk';
            else if (aktivitas === 'Absen Pulang') key = 'pulang';
            else if (aktivitas === 'Izin') key = 'izin';
            else if (aktivitas === 'Sakit') key = 'sakit';
            else if (aktivitas === 'Upload Tugas') key = 'tugas';
            
            if (key) {
                stats.total[key]++;
                if (stats.kelas[kelas]) {
                    stats.kelas[kelas][key]++;
                }
            }
            
            localStorage.setItem('presensi_' + today, JSON.stringify(stats));
            loadStats();
        }
        
        // Load statistik saat halaman dimuat
        loadStats();

        // ==================== SUBMIT ====================
        document.getElementById('submitBtn').onclick = async function() {
            const nama = document.getElementById('nama').value.trim();
            const kelas = document.getElementById('kelas').value;
            const aktivitas = document.getElementById('aktivitas').value;
            
            // Validasi semua field
            if (!nama) { alert('❌ Nama lengkap wajib diisi!'); return; }
            if (!kelas) { alert('❌ Kelas wajib dipilih!'); return; }
            if (!aktivitas) { alert('❌ Aktivitas wajib dipilih!'); return; }
            
            // Validasi foto
            const needPhoto = ['Absen Masuk', 'Absen Pulang', 'Izin', 'Sakit'];
            if (needPhoto.includes(aktivitas) && !capturedPhoto) {
                document.getElementById('cameraWarning').style.display = 'block';
                alert('❌ Foto wajah wajib diambil!');
                return;
            }
            
            // Validasi upload tugas
            if (aktivitas === 'Upload Tugas' && selectedFiles.length === 0) {
                document.getElementById('fileWarning').style.display = 'block';
                alert('❌ Minimal upload 1 file tugas!');
                return;
            }
            
            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '⏳ Mengirim...';
            
            try {
                let tugasData = [];
                if (aktivitas === 'Upload Tugas') {
                    for (const file of selectedFiles) {
                        const compressed = await new Promise(r => {
                            const reader = new FileReader();
                            reader.onload = e => r(e.target.result);
                            reader.readAsDataURL(file);
                        });
                        tugasData.push(compressed);
                    }
                }
                
                const data = { 
                    nama, kelas, aktivitas, 
                    fotoData: capturedPhoto, 
                    tugasData, 
                    lokasi: currentLocation || {},
                    timestamp: new Date().toISOString()
                };
                
                await fetch(API_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(data), 
                    headers: { 'Content-Type': 'application/json' } 
                });
                
                // Update statistik lokal
                updateStats(kelas, aktivitas);
                
                alert('✅ Data berhasil dikirim!');
                
                // Reset form
                document.getElementById('nama').value = '';
                document.getElementById('kelas').value = '';
                document.getElementById('aktivitas').value = '';
                document.getElementById('fileTugas').value = '';
                document.getElementById('filePreview').innerHTML = '';
                selectedFiles = [];
                if (capturedPhoto) document.getElementById('retakeBtn').click();
                getLocation();
                
            } catch(e) { 
                alert('❌ Gagal: ' + e.message); 
            } finally {
                btn.disabled = false;
                btn.innerHTML = '📤 KIRIM SEKANG';
            }
        };
        
        // Start camera awal
        startCamera();
    </script>
</body>
</html>
